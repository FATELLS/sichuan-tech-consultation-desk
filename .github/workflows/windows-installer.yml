name: Validate Windows installer

on:
  push:
    paths:
      - install.ps1
      - .github/workflows/windows-installer.yml
  pull_request:
    paths:
      - install.ps1
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1 with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host (
                "Line {0}, column {1}: {2}" -f
                  $_.Extent.StartLineNumber,
                  $_.Extent.StartColumnNumber,
                  $_.Message
              )
              Write-Host ("Text: {0}" -f $_.Extent.Text)
            }
            exit 1
          }

          Write-Host "install.ps1 syntax is valid in Windows PowerShell."
